stages:
  - install
  - build
  - push

variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - composer.lock
      - package-lock.json
  paths:
    - .composer-cache/
    - .npm/

composer_install:
  stage: install
  image: php:8.4-cli
  before_script:
    - apt-get update && apt-get install -y git unzip curl libpng-dev libjpeg-dev libfreetype6-dev libzip-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install gd zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - composer install --prefer-dist --no-interaction --no-progress --no-scripts
  artifacts:
    paths:
      - vendor/
    expire_in: 1 day

frontend_build:
  stage: build
  image: node:22
  script:
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - public/build/
    expire_in: 1 day

push_harbor_image:
  stage: push
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "harbor-prep" && $HARBOR_REGISTRY && $HARBOR_USERNAME && $HARBOR_PASSWORD && $APP_NAME'
      when: on_success
    - when: never
  script:
    - |
      if [ -n "$HARBOR_PROJECT" ]; then
        export IMAGE_REPO="$HARBOR_PROJECT/$APP_NAME"
      else
        export IMAGE_REPO="$APP_NAME"
      fi
      export IMAGE_REF="$HARBOR_REGISTRY/$IMAGE_REPO"
    - echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" -u "$HARBOR_USERNAME" --password-stdin
    - docker build -f Dockerfile.harbor -t "$IMAGE_REF:$CI_COMMIT_SHORT_SHA" -t "$IMAGE_REF:$CI_COMMIT_REF_SLUG" .
    - docker push "$IMAGE_REF:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_REF:$CI_COMMIT_REF_SLUG"
