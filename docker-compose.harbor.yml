services:
  app:
    image: ${APP_IMAGE}
    restart: always
    ports:
      - "${APP_FORWARD_PORT:-80}:80"
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_SECOND_DATABASE}
      DB_USERNAME: ${DB_SECOND_USERNAME}
      DB_PASSWORD: ${DB_SECOND_PASSWORD}
      DB_SECOND_HOST: db
      DB_SECOND_PORT: 5432
      DB_SECOND_DATABASE: ${DB_SECOND_DATABASE}
      DB_SECOND_USERNAME: ${DB_SECOND_USERNAME}
      DB_SECOND_PASSWORD: ${DB_SECOND_PASSWORD}
      DB_TAKO_HOST: db
      DB_TAKO_PORT: 5432
      DB_TAKO_DATABASE: ${DB_TAKO_DATABASE:-${DB_SECOND_DATABASE}}
      DB_TAKO_USERNAME: ${DB_TAKO_USERNAME:-${DB_SECOND_USERNAME}}
      DB_TAKO_PASSWORD: ${DB_TAKO_PASSWORD:-${DB_SECOND_PASSWORD}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-public}
    volumes:
      - app_storage:/var/www/html/storage
      - /mnt/Ppjk:/mnt/Ppjk
      - /home/it-staff/sites-available:/etc/apache2/sites-available
      - /home/it-staff/sites-enabled:/etc/apache2/sites-enabled
      - /home/it-staff/letsencrypt:/etc/letsencrypt
      - /etc/hosts:/tmp/hosts_external:ro
    depends_on:
      - db
      - redis
    networks:
      - app-network

  reverb:
    image: ${APP_IMAGE}
    restart: always
    working_dir: /var/www/html
    env_file:
      - .env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_FORWARD_PORT:-8080}:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_SECOND_HOST}
      DB_PORT: ${DB_SECOND_PORT}
      DB_DATABASE: ${DB_SECOND_DATABASE}
      DB_USERNAME: ${DB_SECOND_USERNAME}
      DB_PASSWORD: ${DB_SECOND_PASSWORD}
    depends_on:
      - redis
    networks:
      - app-network

  queue:
    image: ${APP_IMAGE}
    restart: always
    working_dir: /var/www/html
    env_file:
      - .env
    command: php artisan queue:work --sleep=1 --tries=3
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_SECOND_HOST}
      DB_PORT: ${DB_SECOND_PORT}
      DB_DATABASE: ${DB_SECOND_DATABASE}
      DB_USERNAME: ${DB_SECOND_USERNAME}
      DB_PASSWORD: ${DB_SECOND_PASSWORD}
    depends_on:
      - redis
      - db
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${DB_SECOND_DATABASE}
      POSTGRES_USER: ${DB_SECOND_USERNAME}
      POSTGRES_PASSWORD: ${DB_SECOND_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app_storage:
  postgres_data:
  redis-data:
